# Bots built with Honocord, listed on /docs/built-with.
# plugins/built-with.ts turns this file into src/lib/generated/built-with.ts, which the page imports.
# Each entry needs a title, a description and a link.

- title: LinguaDeep
  description: A BYOK translator bot that uses DeepL to provide high-quality translations in Discord.
  link: https://linguadeep.thelukez.com

- title: UpvoteEngine
  description: >-
    Handles votes from platforms like top.gg and applies roles, either temporary or permanently, in your associated
    discord server.
  link: https://upvote-engine.thelukez.com

- title: Falu
  description: Falu lets a server owner write exactly who may grant which role to whom.
  link: https://falubot.dev
