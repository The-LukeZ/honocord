name: Release

on:
    push:
        branches:
            - main
            - dev

permissions:
    contents: write # Required for changesets to push version bumps
    pull-requests: write # Required for changesets to create release PRs
    id-token: write # Required for OIDC trusted publishing

jobs:
    release-stable:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  # Needed so changesets can push commits back to main
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"
                  cache: "pnpm"

            - run: pnpm install --frozen-lockfile

            - run: pnpm run build:all

            - run: pnpm typecheck && pnpm typecheck:packages

            - run: pnpm test

            - name: Create Release PR or Publish
              uses: changesets/action@v1
              with:
                  publish: pnpm changeset publish
                  version: pnpm changeset version
                  commit: "chore: release packages"
                  title: "chore: release packages"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_CONFIG_PROVENANCE: true

    release-beta:
        if: github.ref == 'refs/heads/dev'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"
                  cache: "pnpm"

            - run: pnpm install --frozen-lockfile
            - run: pnpm run build:all
            - run: pnpm typecheck && pnpm typecheck:packages
            - run: pnpm test

            - name: Enter pre-release mode if not already
              run: |
                  if [ ! -f .changeset/pre.json ]; then
                      pnpm changeset pre enter beta
                  fi

            - name: Create Release PR or Publish (beta)
              uses: changesets/action@v1
              with:
                  publish: pnpm changeset publish --tag beta
                  version: pnpm changeset version
                  commit: "chore: release beta packages"
                  title: "chore: release beta packages"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_CONFIG_PROVENANCE: true
