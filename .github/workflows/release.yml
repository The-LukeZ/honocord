name: Release

on:
    push:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: write # to create git tags and GitHub Releases
    pull-requests: write # to open and update the "Version Packages" PR
    id-token: write # for npm provenance

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        permissions:
            contents: write # to create git tags and GitHub Releases
            pull-requests: write # to open and update the "Version Packages" PR
            id-token: write # for npm provenance

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  # Fetch full history so Changesets can diff against previous tags
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  registry-url: 'https://registry.npmjs.org'

            - name: Update npm for OIDC trusted publishing
              run: npm install -g npm@latest

            - name: Setup pnpm
              uses: pnpm/action-setup@v3

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build packages
              run: pnpm build

            - name: Create release PR or publish to npm
              uses: changesets/action@v1
              with:
                  publish: pnpm changeset publish --access public
                  version: pnpm changeset version
                  commit: "chore: version packages"
                  title: "chore: version packages"
                  createGithubReleases: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # temporary, until trusted publishing works with custom orgs
                  NPM_CONFIG_PROVENANCE: true
