name: Publish to npm

on:
    push:
        branches:
            - main
            - dev
    workflow_dispatch:

permissions:
    id-token: write # Required for OIDC
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"
                  cache: "pnpm"

            - run: pnpm install --frozen-lockfile --ignore-scripts
            - run: pnpm run build:all
            - run: pnpm typecheck
            - run: pnpm test

            # Stable release (main branch)
            - name: Publish stable release
              if: github.ref == 'refs/heads/main'
              run: |
                  pnpm --filter './packages/*' publish --provenance --access public
                  pnpm publish --provenance --access public

            # Beta release (dev branch)
            - name: Publish beta release
              if: github.ref == 'refs/heads/dev'
              run: |
                  TIMESTAMP=$(date +%s)

                  # Bump version for each subpackage and publish
                  for pkg_dir in packages/*/; do
                    CURRENT_VERSION=$(node -p "require('./${pkg_dir}package.json').version")
                    BETA_VERSION="${CURRENT_VERSION}-beta.${TIMESTAMP}"
                    npm version $BETA_VERSION --no-git-tag-version --prefix "$pkg_dir"
                    pnpm --filter "./${pkg_dir}" publish --tag beta --no-git-checks --provenance --access public
                  done

                  # Bump version for root package and publish
                  CURRENT_VERSION=$(node -p "require('./package.json').version")
                  BETA_VERSION="${CURRENT_VERSION}-beta.${TIMESTAMP}"
                  npm version $BETA_VERSION --no-git-tag-version
                  pnpm publish --tag beta --no-git-checks --provenance --access public
