name: CI - Pull Request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm typecheck

      - run: pnpm run docs:reference

      - run: pnpm test

      - run: pnpm check
