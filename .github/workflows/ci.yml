name: CI - Pull Request

on:
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/setup@v2
              with:
                  version: 11
                  runtime: node@24
                  cache: true
                  install: false

            - run: pnpm install --frozen-lockfile

            - run: pnpm run build:all

            - run: pnpm typecheck && pnpm typecheck:packages

            - run: pnpm test

            - run: pnpm check
