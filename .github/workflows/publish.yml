name: Publish to npm on Push (main)

on:
  push:
    branches:
      - main

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Build all packages first
      - run: pnpm run build:all

      # Typecheck and test
      - run: pnpm typecheck
      - run: pnpm typecheck:packages
      - run: pnpm test

      # Publish packages in order (base first, then others)
      - name: Publish cache-base
        run: cd packages/cache-base && pnpm publish --access public --no-git-checks
        continue-on-error: true

      - name: Publish cache-memory
        run: cd packages/cache-memory && pnpm publish --access public --no-git-checks
        continue-on-error: true

      # - name: Publish cache-d1
      #   run: cd packages/cache-d1 && pnpm publish --access public --no-git-checks
      #   continue-on-error: true

      # Publish main package last
      - name: Publish honocord
        run: pnpm publish --access public --no-git-checks
